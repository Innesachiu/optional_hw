<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>首頁 | 校園二手交易</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/product.css?v=20260615-2">
</head>
<body>
  <div class="page-shell">
    <nav class="navbar">
      <div class="container navbar-inner">
        <a class="brand" href="home.html"><span class="brand-mark">CM</span><span>校園二手交易</span></a>
        <div class="nav-links">
          <!-- Navbar managed by js/navbar.js: fixed IDs, toggle with .hidden -->
          <a id="navHome" class="nav-link" href="home.html">首頁</a>
          <a id="navAddProduct" class="nav-link" href="add-product.html" hidden>上架商品</a>
          <a id="navMyProducts" class="nav-link" href="my-products.html" hidden>我上架的商品</a>
          <a id="navFavorites" class="nav-link" href="my-favorites.html" hidden>我的最愛</a>
          <a id="navMyOrders" class="nav-link" href="my-orders.html" hidden>我的訂單</a>
          <span id="navGuest" class="nav-user">訪客</span>
          <span id="navUsername" class="nav-user" hidden></span>
          <a id="navLoginRegister" class="nav-link" href="login.html">登入 / 註冊</a>
          <button id="navLogout" class="btn btn-danger" type="button" hidden>登出</button>
        </div>
      </div>
    </nav>

    <main class="container">
      <header class="page-header">
        <h1 class="page-title">找到校園裡的下一件好物</h1>
        <p class="page-subtitle">瀏覽最新商品，搜尋課本、3C 與生活用品</p>
      </header>
      <div id="message" class="message" role="status"></div>

      <section class="main-grid">
        <div class="stack">
          <section class="card">
            <div class="card-body">
              <div class="search-panel">
                <input id="keyword" class="input" placeholder="搜尋商品標題或描述">
                <button id="searchBtn" class="btn btn-primary" type="button">搜尋</button>
                <button id="reloadBtn" class="btn btn-secondary" type="button">全部商品</button>
              </div>
            </div>
          </section>

          <section>
            <div class="product-section-header">
              <h2>商品</h2>
              <div class="product-controls">
                <div class="product-filter-control">
                  <label for="category-filter">商品類型</label>
                  <select id="category-filter">
                    <option value="all">全部類型</option>
                  </select>
                </div>

                <div class="product-sort-control">
                  <label for="product-sort">排序方式</label>
                  <select id="product-sort">
                    <option value="latest" selected>最新上架</option>
                    <option value="popular">最多搜尋</option>
                    <option value="price-asc">價格：低到高</option>
                    <option value="price-desc">價格：高到低</option>
                  </select>
                </div>
              </div>
            </div>
                <div id="productList" class="product-grid home-product-grid"></div>
          </section>
        </div>

        <aside class="card">
          <div class="card-body">
            <h2>熱門關鍵字</h2>
              <p class="page-subtitle">最近 7 天內熱門搜尋關鍵字</p>
            <div id="hotKeywords" class="hot-keywords"></div>
          </div>
        </aside>
      </section>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js?v=20260615-2"></script>
  <script src="../js/product.js?v=20260615-3"></script>
  <script src="../js/search.js?v=20260615-2"></script>
</body>
</html>
