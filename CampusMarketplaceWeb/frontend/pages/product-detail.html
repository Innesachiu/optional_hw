<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品詳情 | 校園二手交易</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/product.css">
</head>
<body>
  <div class="page-shell">
    <nav class="navbar">
      <div class="container navbar-inner">
        <a class="brand" href="home.html"><span class="brand-mark">CM</span><span>校園二手交易</span></a>
        <div class="nav-links">
          <!-- Navbar managed by js/navbar.js: fixed IDs, toggle with .hidden -->
          <a id="navHome" class="nav-link" href="home.html">首頁</a>
          <a id="navAddProduct" class="nav-link" href="add-product.html" hidden>上架商品</a>
          <a id="navMyProducts" class="nav-link" href="my-products.html" hidden>我上架的商品</a>
          <a id="navFavorites" class="nav-link" href="my-favorites.html" hidden>我的最愛</a>
          <a id="navMyOrders" class="nav-link" href="my-orders.html" hidden>我的訂單</a>
          <span id="navGuest" class="nav-user">訪客</span>
          <span id="navUsername" class="nav-user" hidden></span>
          <a id="navLoginRegister" class="nav-link" href="login.html">登入 / 註冊</a>
          <button id="navLogout" class="btn btn-danger" type="button" hidden>登出</button>
        </div>
      </div>
    </nav>

    <main class="container">
      <header class="page-header">
        <h1 class="page-title">商品詳情</h1>
        <p class="page-subtitle">確認商品資訊後即可下單</p>
      </header>
      <div id="message" class="message" role="status"></div>
      <section class="card detail-card">
        <div class="card-body">
          <div id="productDetail"></div>
          <div class="actions">
            <button id="orderBtn" class="btn btn-primary" type="button">立即下單</button>
            <button id="favorite-button" type="button" class="btn favorite-button btn-secondary" hidden>
              ♡ 加入最愛
            </button>
            <a class="btn btn-secondary" href="home.html">回首頁</a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Order confirmation modal -->
  <div
    id="order-confirm-modal"
    class="modal-overlay"
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="order-confirm-title"
  >
    <div class="modal-card" role="document">
      <button
        id="order-confirm-close"
        class="modal-close"
        type="button"
        aria-label="關閉確認視窗"
      >
        ×
      </button>

      <h2 id="order-confirm-title">確認購買</h2>

      <p class="modal-message">
        是否確認購買以下商品？
      </p>

      <div class="order-confirm-product">
        <p>
          <span>商品名稱</span>
          <strong id="order-confirm-product-title"></strong>
        </p>

        <p>
          <span>價格</span>
          <strong id="order-confirm-product-price"></strong>
        </p>
      </div>

      <div class="modal-actions">
        <button
          id="order-confirm-cancel"
          class="btn btn-secondary"
          type="button"
        >
          取消
        </button>

        <button
          id="order-confirm-submit"
          class="btn btn-primary"
          type="button"
        >
          確認購買
        </button>
      </div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/product.js"></script>
  <script src="../js/favorite.js"></script>
  <script src="../js/order.js"></script>
</body>
</html>
