<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上架商品 | 校園二手交易</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/product.css">
</head>
<body>
  <div class="page-shell">
    <nav class="navbar">
      <div class="container navbar-inner">
        <a class="brand" href="home.html"><span class="brand-mark">CM</span><span>校園二手交易</span></a>
        <div class="nav-links">
          <!-- Navbar managed by js/navbar.js: fixed IDs, toggle with .hidden -->
          <a id="navHome" class="nav-link" href="home.html">首頁</a>
          <a id="navAddProduct" class="nav-link" href="add-product.html" hidden>上架商品</a>
          <a id="navMyProducts" class="nav-link" href="my-products.html" hidden>我上架的商品</a>
          <a id="navFavorites" class="nav-link" href="my-favorites.html" hidden>我的最愛</a>
          <a id="navMyOrders" class="nav-link" href="my-orders.html" hidden>我的訂單</a>
          <span id="navGuest" class="nav-user">訪客</span>
          <span id="navUsername" class="nav-user" hidden></span>
          <a id="navLoginRegister" class="nav-link" href="login.html">登入 / 註冊</a>
          <button id="navLogout" class="btn btn-danger" type="button" hidden>登出</button>
        </div>
      </div>
    </nav>

    <main class="container">
      <header class="page-header">
        <h1 class="page-title">上架商品</h1>
        <p class="page-subtitle">建立新的商品上架，讓同學看見你的好物</p>
      </header>
      <section class="card">
        <div class="card-body">
          <div id="message" class="message" role="status"></div>
          <form id="addProductForm" class="form-grid">
            <div class="form-row">
              <label for="title">商品名稱</label>
              <input id="title" class="input" placeholder="輸入商品名稱">
            </div>
            <div class="form-row">
              <label for="price">價格</label>
              <div style="display:flex;gap:8px;align-items:center;"><span style="font-weight:800;">NT$</span><input id="price" class="input" type="number" min="1" step="1" placeholder="價格"></div>
            </div>
            <div class="form-row">
              <label for="categoryId">分類</label>
              <select id="categoryId" class="select">
                <option value="">載入中…</option>
              </select>
            </div>
            <div class="form-row">
              <label for="description">描述</label>
              <textarea id="description" class="textarea" placeholder="描述商品狀況、取貨方式與注意事項"></textarea>
            </div>
            <div class="actions">
              <button id="addProductBtn" class="btn btn-primary" type="submit">確認上架</button>
              <a class="btn btn-secondary" href="home.html">回首頁</a>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/product.js"></script>
</body>
</html>
