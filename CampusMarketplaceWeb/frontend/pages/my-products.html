<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Products | Campus Marketplace</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/product.css">
</head>
<body>
  <div class="page-shell">
    <nav class="navbar">
      <div class="container navbar-inner">
        <a class="brand" href="home.html"><span class="brand-mark">CM</span><span>Campus Marketplace</span></a>
        <div class="nav-links">
          <!-- Navbar managed by js/navbar.js: fixed IDs, toggle with .hidden -->
          <a id="navHome" class="nav-link" href="home.html">Home</a>
          <a id="navAddProduct" class="nav-link" href="add-product.html" hidden>Add Product</a>
          <a id="navMyProducts" class="nav-link" href="my-products.html" hidden>My Products</a>
          <a id="navMyOrders" class="nav-link" href="my-orders.html" hidden>My Orders</a>
          <span id="navGuest" class="nav-user">Guest</span>
          <span id="navUsername" class="nav-user" hidden></span>
          <a id="navLoginRegister" class="nav-link" href="login.html">Login / Register</a>
          <button id="navLogout" class="btn btn-danger" type="button" hidden>Logout</button>
        </div>
      </div>
    </nav>

    <main class="container">
      <header class="page-header">
        <h1 class="page-title">My Products</h1>
        <p class="page-subtitle">Products you have listed on the marketplace.</p>
      </header>
      <div id="message" class="message" role="status"></div>

      <section class="card">
        <div class="card-body">
          <div class="actions" style="margin-bottom:12px;">
            <a class="btn btn-primary" href="add-product.html">Add Product</a>
            <a class="btn btn-secondary" href="home.html">Back Home</a>
          </div>
          <div id="myProductList" class="product-grid"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/my-products.js"></script>
</body>
</html>
