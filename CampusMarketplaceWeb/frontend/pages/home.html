<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | Campus Marketplace</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/product.css">
</head>
<body>
  <div class="page-shell">
    <nav class="navbar">
      <div class="container navbar-inner">
        <a class="brand" href="home.html"><span class="brand-mark">CM</span><span>Campus Marketplace</span></a>
        <div class="nav-links">
          <!-- Navbar managed by js/navbar.js: fixed IDs, toggle with .hidden -->
          <a id="navHome" class="nav-link" href="home.html">Home</a>
          <a id="navAddProduct" class="nav-link" href="add-product.html" hidden>Add Product</a>
          <a id="navMyProducts" class="nav-link" href="my-products.html" hidden>My Products</a>
          <a id="navMyOrders" class="nav-link" href="my-orders.html" hidden>My Orders</a>
          <span id="navGuest" class="nav-user">Guest</span>
          <span id="navUsername" class="nav-user" hidden></span>
          <a id="navLoginRegister" class="nav-link" href="login.html">Login / Register</a>
          <button id="navLogout" class="btn btn-danger" type="button" hidden>Logout</button>
        </div>
      </div>
    </nav>

    <main class="container">
      <header class="page-header">
        <h1 class="page-title">Find campus second-hand deals</h1>
        <p class="page-subtitle">Browse active products, search items, and check popular keywords.</p>
      </header>
      <div id="message" class="message" role="status"></div>

      <section class="main-grid">
        <div class="stack">
          <section class="card">
            <div class="card-body">
              <div class="search-panel">
                <input id="keyword" class="input" placeholder="Search title or description">
                <button id="searchBtn" class="btn btn-primary" type="button">Search</button>
                <button id="reloadBtn" class="btn btn-secondary" type="button">All Products</button>
              </div>
            </div>
          </section>

          <section>
            <h2>Products</h2>
            <div id="productList" class="product-grid"></div>
          </section>
        </div>

        <aside class="card">
          <div class="card-body">
            <h2>Hot Keywords</h2>
            <p class="page-subtitle">Popular searches from the last 7 days.</p>
            <div id="hotKeywords" class="hot-keywords"></div>
          </div>
        </aside>
      </section>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/product.js"></script>
  <script src="../js/search.js"></script>
</body>
</html>
