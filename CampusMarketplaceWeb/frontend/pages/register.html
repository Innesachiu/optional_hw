<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>註冊 | 校園二手交易</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="page-shell auth-page">
    <main class="container auth-grid">
      <aside class="auth-promo card">
        <div class="card-body">
          <div class="brand" aria-label="Campus Marketplace">
            <span class="brand-mark">CM</span>
            <span class="brand-name">校園二手交易</span>
          </div>
          <h1 class="promo-title">加入我們</h1>
          <p class="promo-subtitle">註冊後即可上架商品、下訂單並管理你的紀錄</p>
        </div>
      </aside>

      <section class="card auth-card">
        <div class="card-body">
          <h2 class="auth-title">建立新帳號</h2>
          <p class="auth-subtitle">註冊一個帳號以開始使用平台</p>
          <div id="message" class="message" role="status"></div>
          <form id="registerForm" class="form-grid">
            <div class="form-row">
              <label for="username">帳號</label>
              <input id="username" class="input" autocomplete="username" placeholder="輸入帳號">
            </div>
            <div class="form-row">
              <label for="email">電子郵件</label>
              <input id="email" class="input" type="email" autocomplete="email" placeholder="name@example.com">
            </div>
            <div class="form-row">
              <label for="password">密碼</label>
              <input id="password" class="input" type="password" autocomplete="new-password" placeholder="設定密碼">
            </div>
            <div class="form-row">
              <label for="confirmPassword">確認密碼</label>
              <input id="confirmPassword" class="input" type="password" autocomplete="new-password" placeholder="再次輸入密碼">
            </div>
            <button id="registerBtn" class="btn btn-primary" type="submit">註冊</button>
          </form>
          <p class="auth-footer">已經有帳號了？ <a href="login.html">回到登入</a></p>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
